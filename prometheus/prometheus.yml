global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    cluster: coupon-service-local

scrape_configs:
  - job_name: coupon-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: coupon-service

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
