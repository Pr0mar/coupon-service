spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

geolocation:
  api:
    url: http://ip-api.com/json
    connect-timeout-ms: 500
    read-timeout-ms: 1000

resilience4j:
  circuitbreaker:
    instances:
      geoLocation:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
  retry:
    instances:
      geoLocation:
        maxAttempts: 1
        waitDuration: 50ms
